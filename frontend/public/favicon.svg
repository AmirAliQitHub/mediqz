<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f295e"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Gemstone Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Alqualite Gemstone Facets -->
  <g transform="translate(14, 14)" filter="url(#glow)">
    <!-- Top Table Facet -->
    <polygon points="18,2 29,11 7,11" fill="url(#facetTop)"/>
    <!-- Upper Side Facets -->
    <polygon points="7,11 0,16 11,16" fill="#38bdf8" fill-opacity="0.5"/>
    <polygon points="29,11 36,16 25,16" fill="#0284c7" fill-opacity="0.7"/>
    <!-- Center Belt -->
    <polygon points="7,11 29,11 25,16 11,16" fill="#bae6fd" fill-opacity="0.8"/>
    <!-- Lower Pavilions -->
    <polygon points="0,16 18,34 11,16" fill="#0284c7" fill-opacity="0.85"/>
    <polygon points="36,16 18,34 25,16" fill="#0369a1" fill-opacity="0.9"/>
    <polygon points="11,16 25,16 18,34" fill="url(#facetBottom)"/>
  </g>
</svg>
